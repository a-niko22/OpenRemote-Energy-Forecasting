{
  "base_config": "base.yaml",
  "experiment_name": "exp1d_cnn_transformer",
  "model": {
    "name": "cnn_transformer",
    "patch_embed_dim": 64,
    "cnn": {
      "conv_channels": [64, 128],
      "kernel_size": 3,
      "use_pooling": false,
      "pool_kernel": 2,
      "activation": "relu",
      "dropout": 0.1
    },
    "bilstm": null,
    "xlstm": null,
    "transformer": {
      "d_model": 128,
      "nhead": 4,
      "num_layers": 2,
      "dim_feedforward": 256,
      "dropout": 0.2,
      "activation": "relu",
      "pooling": "mean",
      "head_hidden_size": 128,
      "max_len": 10000
    }
  }
}
