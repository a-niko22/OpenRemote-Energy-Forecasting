{
  "base_config": "base.yaml",
  "experiment_name": "exp1a_cnn_bilstm",
  "model": {
    "name": "cnn_bilstm",
    "patch_embed_dim": 64,
    "cnn": {
      "conv_channels": [64, 128],
      "kernel_size": 3,
      "use_pooling": false,
      "pool_kernel": 2,
      "activation": "relu",
      "dropout": 0.1
    },
    "bilstm": {
      "hidden_size": 128,
      "num_layers": 2,
      "dropout": 0.2,
      "head_hidden_size": 128
    }
  }
}
