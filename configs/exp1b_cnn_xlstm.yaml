{
  "base_config": "base.yaml",
  "experiment_name": "exp1b_cnn_xlstm",
  "model": {
    "name": "cnn_xlstm",
    "patch_embed_dim": 64,
    "cnn": {
      "conv_channels": [64, 128],
      "kernel_size": 3,
      "use_pooling": false,
      "pool_kernel": 2,
      "activation": "relu",
      "dropout": 0.1
    },
    "xlstm": {
      "hidden_size": 128,
      "num_layers": 2,
      "dropout": 0.2,
      "projection_size": 128,
      "gate_clamp": 5.0,
      "stability_eps": 1.0e-06,
      "head_hidden_size": 128
    }
  }
}
